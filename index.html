<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무 반자동 모음</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Malgun Gothic", "맑은 고딕", Arial, sans-serif;
    margin: 0; background: #ffffff; color: #1f2937; min-height: 100vh;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 40px 20px 80px; }
  header { margin-bottom: 30px; }
  h1 { font-size: 26px; margin: 0 0 6px; color: #111827; }
  .sub { color: #6b7280; font-size: 14px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
  }
  .card {
    background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px;
    padding: 18px 16px; display: flex; flex-direction: column; gap: 8px;
    min-height: 150px; position: relative; transition: transform .12s, border-color .12s, box-shadow .12s;
  }
  a.card { text-decoration: none; color: inherit; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  a.card:hover { transform: translateY(-3px); border-color: #3b82f6; box-shadow: 0 6px 16px rgba(37,99,235,.15); }
  .num {
    position: absolute; top: 14px; right: 14px; font-size: 12px;
    color: #d1d5db; font-weight: 700;
  }
  .icon {
    font-size: 28px; width: 52px; height: 52px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #eff6ff, #dbeafe);
  }
  .name { font-size: 15px; font-weight: 700; color: #111827; }
  .desc { font-size: 12.5px; color: #6b7280; line-height: 1.5; flex: 1; }
  .go { font-size: 13px; color: #2563eb; font-weight: 700; }
  .card.empty { background: #fafafa; border-style: dashed; box-shadow: none; }
  .card.empty .icon { background: #f3f4f6; opacity: .6; }
  .card.empty .name { color: #9ca3af; }
  footer { margin-top: 36px; font-size: 12px; color: #9ca3af; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧰 업무 반자동 모음</h1>
    <div class="sub">반복 업무를 반자동으로 처리하는 도구 모음 · 카드를 클릭하면 실행됩니다</div>
  </header>

  <div class="grid" id="grid"></div>

  <footer>
    입력한 데이터는 브라우저 안에서만 처리되며 서버에 저장되지 않습니다.
  </footer>
</div>

<script>
"use strict";
/* 도구 등록: 여기에 한 줄 추가하면 카드가 생깁니다.
   { icon, name, desc, url }  — url이 없으면 "준비중" 슬롯 */
var TOOLS = [
  { icon: "🚚", name: "CJ대한통운 대량 배송조회",
    desc: "송장번호를 한꺼번에 붙여넣으면 전체 배송상태를 실시간 조회하고, 배송완료가 아닌 건만 추려서 엑셀로 저장합니다.",
    url: "tools/cj-tracking.html" },
  { icon: "📦", name: "송장 엑셀 생성기 (한진·플레이오토)",
    desc: "발송 정보를 입력하거나 카톡 메시지를 붙여넣으면 한진택배 대량등록 엑셀과 플레이오토 업로드 엑셀을 자동 생성합니다. 우편번호 자동 채우기 지원.",
    url: "tools/invoice-excel.html" },
  { icon: "🚛", name: "한진택배 대량 배송조회",
    desc: "한진 운송장번호를 한꺼번에 붙여넣으면 전체 배송상태를 실시간 조회하고, 미배송 건만 추려서 엑셀로 저장합니다.",
    url: "tools/hanjin-tracking.html" },
  { icon: "🔄", name: "쇼핑몰 주문엑셀 변환기",
    desc: "지마켓·스마트스토어·쿠팡 등 주문 엑셀을 올리면 열을 자동 인식해서 한진/플레이오토 양식으로 변환합니다.",
    url: "tools/order-converter.html" },
];
var TOTAL_SLOTS = 20;

var grid = document.getElementById("grid");
for (var i = 0; i < TOTAL_SLOTS; i++) {
  var t = TOOLS[i];
  var card;
  if (t && t.url) {
    card = document.createElement("a");
    card.className = "card";
    card.href = t.url;
    card.innerHTML =
      '<span class="num">' + String(i+1).padStart(2,"0") + '</span>' +
      '<div class="icon">' + t.icon + '</div>' +
      '<div class="name">' + t.name + '</div>' +
      '<div class="desc">' + t.desc + '</div>' +
      '<div class="go">실행 →</div>';
  } else {
    card = document.createElement("div");
    card.className = "card empty";
    card.innerHTML =
      '<span class="num">' + String(i+1).padStart(2,"0") + '</span>' +
      '<div class="icon">➕</div>' +
      '<div class="name">준비중</div>' +
      '<div class="desc">다음 도구가 들어올 자리입니다.</div>';
  }
  grid.appendChild(card);
}
</script>
</body>
</html>
